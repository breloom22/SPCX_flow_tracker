# 락업 트랜치 추출 — Claude Code 운영 세션 산출물 (스펙 §5)
# 검증: src/schemas.py:LockupExtraction (Pydantic). 파이프라인이 재검증 후에만 적재.
#
# 주의:
# - 모든 release_shares는 원문의 "Up to N million shares" (상한). 예측 매도량이 아님.
# - absolute_days 트리거의 anchor = 'date of this prospectus' ≈ 프라이싱일(2026-06-11).
#   (S-1/A에는 최종 prospectus 날짜 미확정. 424B4 확정 시 1일 내외 보정 → needs_review 성격)
# - earnings_relative 트리거의 분기 실적일은 config/spcx.yaml:lockup.earnings_schedule(추정)로 해석.
# - 이 문서는 S-1/A(2026-06-03)이며 최종 424B4가 아님. 가격 확정/정정 시 재추출.

schema_version: 1
ticker: SPCX

provenance:
  source_accession: "0001628280-26-040364"
  source_url: "https://www.sec.gov/Archives/edgar/data/1181412/000162828026040364"
  extracted_at: 2026-06-10T14:30:00
  extracted_by: claude-code
  confidence: rule_based   # 트랜치 구조·물량 상한은 원문 명시; 일부 날짜는 추정 실적일에 의존
  source_quote: >-
    "these restricted securities will be available for sale in the public market as follows
    (assuming no exercise of outstanding stock options subsequent to March 31, 2026 and no
    settlement of RSUs and RSAs): ... The second full trading day on Nasdaq immediately
    following the First Earnings Release Date — Up to 911.5 million shares ...
    366 th day after the date of this prospectus — Up to 6.4 billion shares ... representing
    all shares held by Mr. Musk. ... Mr. Musk has agreed ... during a period of 366 days
    after the date of this prospectus ... Shares held by Mr. Musk will not be subject to any
    early release provisions. Together, the shares subject to these restrictions for over one
    year include an aggregate of 7.8 billion shares owned (including 100% of the shares owned
    by Mr. Musk), representing approximately 60% of our shares outstanding."

