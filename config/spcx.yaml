# --- Module B/C 관측 유니버스 ---
observe:
  target: SPCX
  index_etfs: [QQQ, QQQM]                  # 나스닥100 추종 (AUM/리밸런스 관측)
  thematic_etfs: [UFO, XOVR, ARKX]         # 우주/프리IPO 테마 ETF (리테일 과열 게이지)
  closed_end: [DXYZ]                        # 폐쇄형 — NAV 프리미엄 게이지
  btc_etfs: [IBIT, FBTC]                    # BTC 현물 ETF — 크로스에셋 흡수 프록시
  # 편입 선행매매 탐지 대상 = nasdaq100_top_constituents (별도)
  zscore_window: 60                         # 롤링 z-score 윈도우(거래일)
  zscore_flag_threshold: 2.0                # |z| >= 2 비정상
  event_study_window: {pre: 15, post: 5}    # [T-15, T+5] 이벤트 윈도우

# --- 자기강화 루프 시뮬레이터 가정 (A1) ---
self_reinforcing:
  price_impact_coeff: 0.10   # 선형 가정: Δprice% = coeff × (순매수액 / float시총). 단순화, 정교화는 추후.
  max_iterations: 25
  convergence_tol_usd: 100000000  # 추가 매수 < $1억이면 수렴
